<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shipping — Columbine Copy & Apparel</title>
<style>
  :root {
    --ink: #1c1f26;
    --paper: #f7f5f1;
    --card: #ffffff;
    --line: #dcd7cd;
    --accent: #2f5233;
    --accent-dark: #203a24;
    --muted: #6b6558;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 32px 24px 60px;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header h1 {
    margin: 0;
    font-size: 26px;
  }
  header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 15px;
  }

  /* Idle state */
  .idle {
    text-align: center;
    padding: 100px 20px;
    color: var(--muted);
  }
  .idle .icon {
    font-size: 56px;
    margin-bottom: 16px;
  }
  .idle h2 {
    color: var(--ink);
    font-size: 22px;
    margin: 0 0 8px;
  }

  /* Active quote state */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 18px;
  }
  .card h2 {
    margin: 0 0 14px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f0eee9;
    font-size: 16px;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: var(--muted); }
  .detail-value { font-weight: 600; text-align: right; }

  .rate-option {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 10px;
    background: #fdfcfa;
  }
  .rate-info .service { font-weight: 700; font-size: 17px; }
  .rate-info .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .rate-price { font-size: 22px; font-weight: 700; color: var(--accent-dark); }

  /* Completed state */
  .completed {
    text-align: center;
    padding: 40px 20px;
  }
  .completed .check {
    font-size: 60px;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .completed h2 {
    font-size: 24px;
    margin: 0 0 20px;
  }
  .completed .price-big {
    font-size: 36px;
    font-weight: 700;
    color: var(--accent-dark);
    margin: 14px 0;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Columbine Copy &amp; Apparel</h1>
    <p>Shipping Services</p>
  </header>

  <div id="content">
    <div class="idle" id="idleState">
      <div class="icon">📦</div>
      <h2>Ready to help you ship</h2>
      <p>Please hand this to our team member to get started.</p>
    </div>
  </div>
</div>

<script>
  const POLL_INTERVAL_MS = 2000;
  let lastSnapshot = "";

  async function poll() {
    try {
      const res = await fetch("/.netlify/functions/get-session", { cache: "no-store" });
      const data = await res.json();
      const snapshot = JSON.stringify(data);

      if (snapshot !== lastSnapshot) {
        lastSnapshot = snapshot;
        render(data);
      }
    } catch (err) {
      // Silent fail — just keep showing whatever's currently on screen and retry next poll.
    }
  }

  function render(data) {
    const content = document.getElementById("content");

    if (!data.active) {
      content.innerHTML = `
        <div class="idle">
          <div class="icon">📦</div>
          <h2>Ready to help you ship</h2>
          <p>Please hand this to our team member to get started.</p>
        </div>
      `;
      return;
    }

    if (data.status === "completed" && data.completedInfo) {
      const info = data.completedInfo;
      content.innerHTML = `
        <div class="card completed">
          <div class="check">✓</div>
          <h2>Label Purchased!</h2>
          <div class="detail-row"><span class="detail-label">Service</span><span class="detail-value">${escapeHtml(info.service || "")}</span></div>
          <div class="detail-row"><span class="detail-label">Tracking #</span><span class="detail-value">${escapeHtml(info.trackingNumber || "")}</span></div>
          <div class="price-big">$${parseFloat(info.price || 0).toFixed(2)}</div>
          <p style="color:var(--muted);">Please proceed to payment.</p>
        </div>
      `;
      return;
    }

    // Active quote — show details + rate options
    let ratesHtml = "";
    if (data.rates && data.rates.length > 0) {
      ratesHtml = data.rates.map((r) => `
        <div class="rate-option">
          <div class="rate-info">
            <div class="service">${escapeHtml(r.carrier)} — ${escapeHtml(r.service)}</div>
            <div class="meta">${escapeHtml(r.durationTerms || (r.estimatedDays ? r.estimatedDays + " business days" : ""))}</div>
          </div>
          <div class="rate-price">$${r.price}</div>
        </div>
      `).join("");
    }

    content.innerHTML = `
      <div class="card">
        <h2>Shipping To</h2>
        <div class="detail-row"><span class="detail-label">Name</span><span class="detail-value">${escapeHtml(data.customerName || "")}</span></div>
        <div class="detail-row"><span class="detail-label">Address</span><span class="detail-value">${escapeHtml(data.address || "")}</span></div>
        <div class="detail-row"><span class="detail-label">Package</span><span class="detail-value">${escapeHtml(data.packageSummary || "")}</span></div>
      </div>
      ${ratesHtml ? `<div class="card"><h2>Please Confirm Your Shipping Option</h2>${ratesHtml}</div>` : ""}
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  poll();
  setInterval(poll, POLL_INTERVAL_MS);
</script>

</body>
</html>
