<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shipping Counter — Columbine Copy & Apparel</title>
<style>
  :root {
    --ink: #1c1f26;
    --paper: #f7f5f1;
    --card: #ffffff;
    --line: #dcd7cd;
    --accent: #2f5233; /* deep pine — matches a print-shop/outdoors CO feel */
    --accent-dark: #203a24;
    --warn: #b3441e;
    --muted: #6b6558;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 24px 28px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 0.01em;
  }
  header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 14px;
  }
  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 {
    margin: 0 0 16px;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  #pin-gate {
    max-width: 360px;
    margin: 60px auto 0;
    text-align: center;
  }
  #pin-gate input {
    text-align: center;
    letter-spacing: 0.2em;
    font-size: 22px;
  }
  .optional-tag {
    font-weight: 400;
    color: var(--muted);
    text-transform: none;
    letter-spacing: normal;
  }
  .checkbox-field {
    padding: 4px 0;
  }
  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
  }
  .checkbox-label input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }
  input {
    font-size: 18px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fdfcfa;
    color: var(--ink);
    width: 100%;
    min-width: 0;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(47,82,51,0.12);
  }
  .dims-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .dims-row.mailer {
    grid-template-columns: 1fr 1fr;
  }
  .dims-row input,
  .weight-row input {
    padding: 12px 8px;
    text-align: center;
    font-size: 17px;
  }
  .toggle-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .toggle-btn {
    font-size: 15px;
    font-weight: 600;
    padding: 12px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fdfcfa;
    color: var(--muted);
    cursor: pointer;
  }
  .toggle-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .weight-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  button {
    font-size: 17px;
    font-weight: 600;
    padding: 16px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    width: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    margin-top: 18px;
  }
  .btn-primary:active { background: var(--accent-dark); }
  .btn-primary:disabled { background: #a9a49a; cursor: default; }
  .rates {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .rate-option {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fdfcfa;
  }
  .rate-option.selected {
    border-color: var(--accent);
    background: #eef3ee;
  }
  .rate-info .service { font-weight: 700; font-size: 16px; }
  .rate-info .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .rate-price { font-size: 20px; font-weight: 700; color: var(--accent-dark); }
  .radio-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--line);
    margin-right: 12px;
    flex-shrink: 0;
  }
  .rate-option.selected .radio-dot {
    border-color: var(--accent);
    background: radial-gradient(var(--accent) 0 40%, transparent 42%);
  }
  .rate-row { display: flex; align-items: center; }
  .status-msg {
    font-size: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 14px;
  }
  .status-msg.error { background: #fbe9e3; color: var(--warn); }
  .status-msg.success { background: #e8f0e9; color: var(--accent-dark); }
  .hidden { display: none; }
  .label-link {
    display: block;
    text-align: center;
    background: var(--accent-dark);
    color: #fff;
    text-decoration: none;
    padding: 16px;
    border-radius: 8px;
    font-weight: 700;
    margin-top: 12px;
  }
  .tracking {
    font-size: 14px;
    color: var(--muted);
    margin-top: 10px;
    text-align: center;
  }
  .print-note {
    font-size: 13px;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<header>
  <h1>Shipping Counter</h1>
  <p>Columbine Copy &amp; Apparel — 419 N. 1st Street, Montrose, CO</p>
</header>

<main>

  <div class="card" id="pin-gate">
    <h2>Staff Access</h2>
    <div class="field full">
      <label for="staffPin">Enter staff PIN to unlock this tool</label>
      <input type="password" id="staffPin" inputmode="numeric" placeholder="PIN" autocomplete="off">
    </div>
    <button class="btn-primary" id="unlockBtn">Unlock</button>
    <div id="pinError" class="status-msg error hidden" style="margin-top:12px;"></div>
  </div>

  <div id="tool-content" class="hidden">

  <div class="card" id="input-card">
    <h2>Destination &amp; Package</h2>
    <div class="grid">
      <div class="field full">
        <label for="destName">Customer name</label>
        <input type="text" id="destName" placeholder="For the label" required>
      </div>
      <div class="field full">
        <label for="destCompany">Business name <span class="optional-tag">(optional)</span></label>
        <input type="text" id="destCompany" placeholder="Company / organization">
      </div>
      <div class="field full">
        <label for="destStreet1">Street address</label>
        <input type="text" id="destStreet1" placeholder="Start typing to search..." required autocomplete="off">
      </div>
      <div class="field full checkbox-field">
        <label class="checkbox-label">
          <input type="checkbox" id="isPoBox">
          This is a P.O. Box (shows USPS options only)
        </label>
      </div>
      <div class="field">
        <label for="destCity">City</label>
        <input type="text" id="destCity" placeholder="City" required>
      </div>
      <div class="field">
        <label for="destState">State</label>
        <input type="text" id="destState" placeholder="e.g. CO" maxlength="2" required>
      </div>
      <div class="field full">
        <label for="destZip">ZIP code</label>
        <input type="text" id="destZip" inputmode="numeric" placeholder="e.g. 90028" maxlength="5" required>
      </div>
      <div class="field full">
        <label for="refNumber">Reference / RA# <span class="optional-tag">(optional, prints on label)</span></label>
        <input type="text" id="refNumber" placeholder="e.g. RA-10294" maxlength="60">
      </div>
      <div class="field full">
        <label for="weightLb">Weight (lb)</label>
        <input type="number" id="weightLb" inputmode="decimal" placeholder="e.g. 4.8" step="0.1" min="0.1">
      </div>
      <div class="field full">
        <label>Package Type</label>
        <div class="toggle-row">
          <button type="button" class="toggle-btn active" id="typeBoxBtn" data-type="box">Box</button>
          <button type="button" class="toggle-btn" id="typeMailerBtn" data-type="mailer">Poly Mailer</button>
        </div>
      </div>
      <div class="field full" id="dimsField">
        <label id="dimsLabel">Box dimensions (in)</label>
        <div class="dims-row" id="dimsRow">
          <input type="number" id="lengthIn" placeholder="L" inputmode="decimal" min="1">
          <input type="number" id="widthIn" placeholder="W" inputmode="decimal" min="1">
          <input type="number" id="heightIn" placeholder="H" inputmode="decimal" min="1">
        </div>
      </div>
    </div>
    <button class="btn-primary" id="getRatesBtn">Get Shipping Options</button>
    <button type="button" id="clearDisplayBtn" style="margin-top:10px; background:none; border:1px solid var(--line); color:var(--muted); padding:10px; border-radius:8px; width:100%; font-size:14px; cursor:pointer;">Reset Customer Display</button>
  </div>

  <div id="status-area"></div>

  <div class="card hidden" id="rates-card">
    <h2>Select a Shipping Option</h2>
    <div class="rates" id="rates-list"></div>
    <button class="btn-primary" id="buyLabelBtn" disabled>Buy Label &amp; Print</button>
  </div>

  <div class="card hidden" id="label-card">
    <h2>Label Ready</h2>
    <a href="#" id="labelLink" class="label-link" target="_blank">Open Label PDF</a>
    <a href="#" id="receiptLink" class="label-link hidden" target="_blank" style="background: var(--accent);">Open Receipt PDF</a>
    <p class="tracking" id="trackingInfo"></p>
    <p class="print-note">
      Print both: open each PDF, then use the Share menu → <strong>Labelife</strong> app to send to the printer.
    </p>
  </div>

  </div>

</main>

<script>
  // Parses a Google Places result into our city/state/zip fields
  function initAutocomplete() {
    const streetInput = document.getElementById("destStreet1");
    const autocomplete = new google.maps.places.Autocomplete(streetInput, {
      componentRestrictions: { country: "us" },
      fields: ["address_components", "formatted_address"],
      types: ["address"],
    });

    autocomplete.addListener("place_changed", () => {
      const place = autocomplete.getPlace();
      if (!place.address_components) return;

      let streetNumber = "", route = "", city = "", state = "", zip = "";

      place.address_components.forEach((component) => {
        const types = component.types;
        if (types.includes("street_number")) streetNumber = component.long_name;
        if (types.includes("route")) route = component.long_name;
        if (types.includes("locality")) city = component.long_name;
        if (types.includes("administrative_area_level_1")) state = component.short_name;
        if (types.includes("postal_code")) zip = component.long_name;
      });

      document.getElementById("destStreet1").value = `${streetNumber} ${route}`.trim();
      document.getElementById("destCity").value = city;
      document.getElementById("destState").value = state;
      document.getElementById("destZip").value = zip;
    });
  }
</script>
<script async
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBz-MrJ7nzusOAC885sG1mmWz9gwR78I1Y&libraries=places&loading=async&callback=initAutocomplete">
</script>

<script>
  const state = { shipmentId: null, selectedRate: null, packageType: "box", pin: null };
  const MAILER_HEIGHT_IN = "1"; // standard flat estimate for poly mailers

  const $ = (id) => document.getElementById(id);
  const statusArea = $("status-area");

  $("unlockBtn").addEventListener("click", attemptUnlock);
  $("staffPin").addEventListener("keydown", (e) => {
    if (e.key === "Enter") attemptUnlock();
  });

  // Pushes the current customer/rate info to the customer-facing tablet display.
  // Fire-and-forget — a failure here should never interrupt the main quote/purchase flow.
  async function pushToDisplay(rates, completedInfo) {
    try {
      const packageType = state.packageType === "mailer" ? "Poly Mailer" : "Box";
      const dims = state.packageType === "mailer"
        ? `${$("lengthIn").value}" x ${$("widthIn").value}"`
        : `${$("lengthIn").value}" x ${$("widthIn").value}" x ${$("heightIn").value}"`;
      const weight = $("weightLb").value ? `${$("weightLb").value} lb` : "";

      await fetch("/.netlify/functions/save-session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          pin: state.pin,
          status: completedInfo ? "completed" : "quote",
          customerName: $("destName").value.trim(),
          address: `${$("destStreet1").value.trim()}, ${$("destCity").value.trim()}, ${$("destState").value.trim()} ${$("destZip").value.trim()}`,
          packageSummary: `${packageType}, ${dims}, ${weight}`,
          rates: rates || [],
          completedInfo: completedInfo || null,
        }),
      });
    } catch (err) {
      // Silent — display sync is a bonus feature, not critical path.
    }
  }

  async function clearDisplay() {
    try {
      await fetch("/.netlify/functions/clear-session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pin: state.pin }),
      });
    } catch (err) {
      // Silent — non-critical.
    }
  }

  async function attemptUnlock() {
    const enteredPin = $("staffPin").value.trim();
    const pinErrorEl = $("pinError");
    pinErrorEl.classList.add("hidden");

    if (!enteredPin) return;

    $("unlockBtn").disabled = true;
    $("unlockBtn").textContent = "Checking...";

    try {
      // Verified against the server on first use; also sent with every
      // rate/label request so the functions themselves stay protected.
      const res = await fetch("/.netlify/functions/verify-pin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pin: enteredPin }),
      });

      if (!res.ok) {
        pinErrorEl.textContent = "Incorrect PIN. Please try again.";
        pinErrorEl.classList.remove("hidden");
        $("staffPin").value = "";
        return;
      }

      state.pin = enteredPin;
      $("pin-gate").classList.add("hidden");
      $("tool-content").classList.remove("hidden");
    } catch (err) {
      pinErrorEl.textContent = "Network error — please try again.";
      pinErrorEl.classList.remove("hidden");
    } finally {
      $("unlockBtn").disabled = false;
      $("unlockBtn").textContent = "Unlock";
    }
  }

  $("typeBoxBtn").addEventListener("click", () => setPackageType("box"));
  $("typeMailerBtn").addEventListener("click", () => setPackageType("mailer"));

  function setPackageType(type) {
    state.packageType = type;
    $("typeBoxBtn").classList.toggle("active", type === "box");
    $("typeMailerBtn").classList.toggle("active", type === "mailer");

    const heightInput = $("heightIn");
    const dimsRow = $("dimsRow");
    const dimsLabel = $("dimsLabel");

    if (type === "mailer") {
      heightInput.classList.add("hidden");
      heightInput.value = "";
      dimsRow.classList.add("mailer");
      dimsLabel.textContent = "Mailer dimensions, flat (in)";
    } else {
      heightInput.classList.remove("hidden");
      dimsRow.classList.remove("mailer");
      dimsLabel.textContent = "Box dimensions (in)";
    }
  }

  function showStatus(message, type) {
    statusArea.innerHTML = `<div class="status-msg ${type}">${message}</div>`;
  }
  function clearStatus() { statusArea.innerHTML = ""; }

  $("clearDisplayBtn").addEventListener("click", () => {
    clearDisplay();
    showStatus("Customer display reset.", "success");
  });

  $("getRatesBtn").addEventListener("click", async () => {
    clearStatus();
    const destName = $("destName").value.trim();
    const destStreet1 = $("destStreet1").value.trim();
    const destCity = $("destCity").value.trim();
    const destState = $("destState").value.trim();
    const destZip = $("destZip").value.trim();
    const weightLb = $("weightLb").value.trim();
    const lengthIn = $("lengthIn").value.trim();
    const widthIn = $("widthIn").value.trim();
    const heightIn = state.packageType === "mailer" ? MAILER_HEIGHT_IN : $("heightIn").value.trim();

    const dimsMissing = state.packageType === "mailer"
      ? (!lengthIn || !widthIn)
      : (!lengthIn || !widthIn || !heightIn);

    if (!destName || !destStreet1 || !destCity || !destState || !destZip || !weightLb || dimsMissing) {
      showStatus("Please fill in the customer's full name, address, weight, and dimensions.", "error");
      return;
    }

    $("getRatesBtn").disabled = true;
    $("getRatesBtn").textContent = "Getting rates...";
    $("rates-card").classList.add("hidden");
    $("label-card").classList.add("hidden");
    $("receiptLink").classList.add("hidden");

    try {
      const res = await fetch("/.netlify/functions/get-shipping-rates", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          pin: state.pin,
          destZip,
          destName,
          destCompany: $("destCompany").value.trim(),
          destStreet1,
          destCity,
          destState,
          isPoBox: $("isPoBox").checked,
          refNumber: $("refNumber").value.trim(),
          weightLb: weightLb,
          weightUnit: "lb",
          lengthIn,
          widthIn,
          heightIn,
        }),
      });

      const data = await res.json();

      if (!res.ok) {
        showStatus(data.error || "Could not get shipping rates. Please try again.", "error");
        return;
      }

      if (!data.rates || data.rates.length === 0) {
        showStatus("No shipping options found for this address. Double-check the ZIP code.", "error");
        return;
      }

      state.shipmentId = data.shipmentId;
      renderRates(data.rates);
      if (data.note) {
        showStatus(data.note, "success");
      }
      pushToDisplay(data.rates);
    } catch (err) {
      showStatus("Network error — check the connection and try again.", "error");
    } finally {
      $("getRatesBtn").disabled = false;
      $("getRatesBtn").textContent = "Get Shipping Options";
    }
  });

  function renderRates(rates) {
    const list = $("rates-list");
    list.innerHTML = "";
    state.selectedRate = null;
    $("buyLabelBtn").disabled = true;

    rates.forEach((rate) => {
      const el = document.createElement("div");
      el.className = "rate-option";
      el.innerHTML = `
        <div class="rate-row">
          <div class="radio-dot"></div>
          <div class="rate-info">
            <div class="service">${rate.carrier} — ${rate.service}</div>
            <div class="meta">${rate.durationTerms || (rate.estimatedDays ? rate.estimatedDays + " business days" : "Estimated delivery varies")}</div>
          </div>
        </div>
        <div class="rate-price">$${rate.price}</div>
      `;
      el.addEventListener("click", () => {
        document.querySelectorAll(".rate-option").forEach((o) => o.classList.remove("selected"));
        el.classList.add("selected");
        state.selectedRate = rate;
        $("buyLabelBtn").disabled = false;
      });
      list.appendChild(el);
    });

    $("rates-card").classList.remove("hidden");
  }

  $("buyLabelBtn").addEventListener("click", async () => {
    if (!state.selectedRate) return;
    clearStatus();
    $("buyLabelBtn").disabled = true;
    $("buyLabelBtn").textContent = "Purchasing label...";

    try {
      const res = await fetch("/.netlify/functions/buy-label", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pin: state.pin, rateId: state.selectedRate.rateId }),
      });

      const data = await res.json();

      if (!res.ok) {
        showStatus(data.error || "Could not purchase the label. Please try again.", "error");
        $("buyLabelBtn").disabled = false;
        $("buyLabelBtn").textContent = "Buy Label & Print";
        return;
      }

      $("labelLink").href = data.labelUrl;
      $("trackingInfo").textContent = `Tracking #: ${data.trackingNumber || "N/A"}`;

      pushToDisplay(null, {
        service: state.selectedRate.service,
        price: state.selectedRate.price,
        trackingNumber: data.trackingNumber,
      });
      $("label-card").classList.remove("hidden");
      showStatus("Label purchased successfully.", "success");

      // Generate the customer-facing receipt (tracking + price paid)
      try {
        const receiptRes = await fetch("/.netlify/functions/generate-receipt", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            pin: state.pin,
            customerName: $("destName").value.trim(),
            carrier: data.carrier || state.selectedRate.carrier,
            service: state.selectedRate.service,
            price: state.selectedRate.price,
            trackingNumber: data.trackingNumber,
          }),
        });
        const receiptData = await receiptRes.json();
        if (receiptRes.ok && receiptData.receiptBase64) {
          const byteChars = atob(receiptData.receiptBase64);
          const byteNumbers = new Array(byteChars.length);
          for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
          const blob = new Blob([new Uint8Array(byteNumbers)], { type: "application/pdf" });
          const receiptUrl = URL.createObjectURL(blob);
          $("receiptLink").href = receiptUrl;
          $("receiptLink").classList.remove("hidden");
        }
      } catch (receiptErr) {
        console.error("Receipt generation failed:", receiptErr);
        // Label already purchased successfully — receipt failure shouldn't block the flow.
      }
    } catch (err) {
      showStatus("Network error while purchasing the label. Please try again.", "error");
    } finally {
      $("buyLabelBtn").disabled = false;
      $("buyLabelBtn").textContent = "Buy Label & Print";
    }
  });
</script>

</body>
</html>
